name: kids_transport
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # 1. إدارة الحالة (State Management)
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # 2. حقن الاعتماديات
  get_it: ^7.6.0

  # 3. الاتصال بالسيرفر والـ API (Network)
  dio: ^5.4.0
  dartz: ^0.10.1

  # 4. التصميم المتجاوب والمقاسات (UI Responsive)
  flutter_screenutil: ^5.9.3

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  pin_code_fields: ^8.0.1
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.3
  image_blur_detection: ^1.0.1
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  intl: ^0.20.2
  convex_bottom_bar: ^3.2.0
  share_plus: ^13.2.0
  google_nav_bar: ^5.0.7
  geolocator: ^14.0.3
  cached_network_image: ^3.4.1
  flutter_map_animations: ^0.10.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.0
  flutter_svg: ^2.3.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  flutter_rating_bar: ^4.0.1
  firebase_core: ^4.12.1
  cloud_firestore: ^6.7.1
  firebase_auth: ^6.5.6
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^19.0.0
  firebase_storage: ^13.4.5
  record: ^6.0.0
  audioplayers: ^6.1.0
  mobile_scanner: ^7.4.0
  googleapis_auth: ^1.4.1
  http: ^1.2.0
  device_info_plus: ^13.2.0
  package_info_plus: ^10.1.0
  battery_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  # أصول الصور (Assets) منسقة بمسافتين تحت flutter
  assets:
    - assets/images/
    - assets/fonts/
    - assets/service_account.json
    - assets/mock_routes/

  # الخطوط (Fonts) منسقة بمسافتين تحت flutter
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700